<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WAB Ext</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <!-- Main landmark for screen readers -->
    <main role="main">

        <!-- Header container for layout and accessibility -->
        <div class="header-container">
            <h1 id="popup-title">Send WhatsApp Message</h1>
            <!-- Accessible Close Button with explicit label -->
            <button type="button" id="closeBtn" class="close-button" aria-label="Close">Close</button>
        </div>

        <!-- Update Status Announcer - for important updates and alerts -->
        <!-- NOT display:none — screen readers ignore display:none elements -->
        <div id="update-announcer" role="alert" aria-live="assertive" aria-atomic="true" tabindex="-1" class="sr-only">
        </div>
        <!-- Second assertive live region for alternating announcements (forces re-announce of identical messages) -->
        <div id="update-announcer-2" role="alert" aria-live="assertive" aria-atomic="true" tabindex="-1" class="sr-only">
        </div>

        <!-- Phone input group -->
        <label for="phone" id="phone-label">Phone Numbers</label>
        <input type="text" id="phone" value="" placeholder="e.g., 9495342265, 918888888888" aria-label="Recipient phone numbers" aria-describedby="phone-instructions" aria-required="true" required>
        <!-- Accessible hidden instructions read aloud by screen readers when focusing phone field -->
        <p id="phone-instructions" class="sr-only">Enter one or more phone numbers, separated by commas.</p>

        <!-- Message input group -->
        <label for="message" id="message-label">Message:</label>
        <textarea id="message" rows="4" placeholder="Type your message here..." aria-label="Message" aria-required="true" required></textarea>

        <!-- Action button -->
        <button id="sendBtn" class="send-button" type="button" aria-label="Send message">Send Message</button>

        <!-- Visible status area for sighted users -->
        <div id="status" aria-hidden="true"></div>

        <!-- The status announcer MUST be present on load and strictly empty -->
        <!-- This region is for general visual status updates (screen reader uses content script) -->
        <div id="status-announcer" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" class="sr-only"></div>
        <!-- Second polite live region for alternating announcements (forces re-announce of identical messages) -->
        <div id="status-announcer-2" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" class="sr-only"></div>



    </main>

    <script src="utils.js"></script>
    <script src="popup.js"></script>
</body>

</html>
